[workspace]
members = [
    "crates/die-yield-core",
    "crates/die-yield-render",
    "crates/die-yield-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Huang Rui <vowstar@gmail.com>"]
repository = "https://github.com/vowstar/die-yield-calculator"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "glow",
    "links",
    "persistence",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = { version = "=0.36.1", default-features = false, features = ["default_fonts", "serde"] }
epaint_default_fonts = "=0.36.1"
env_logger = "0.11.8"
js-sys = "0.3.70"
log = "0.4.27"
open = "5.4.1"
# Match svg2pdf's renderer generation to keep the WebAssembly bundle lean.
resvg = { version = "=0.45.1", default-features = false, features = ["raster-images", "text"] }
rfd = "0.17.2"
serde = { version = "1.0.219", features = ["derive"] }
svg2pdf = { version = "0.13.0", default-features = false, features = ["image", "text"] }
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"

[workspace.lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
