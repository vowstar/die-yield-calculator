<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <meta
      name="description"
      content="An interactive wafer die-yield and probe-planning workspace."
    >
    <title>Die Yield Calculator</title>
    <base data-trunk-public-url>
    <link data-trunk rel="copy-file" href="favicon.svg">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link
      data-trunk
      rel="rust"
      href="../crates/die-yield-gui/Cargo.toml"
      data-bin="die-yield-gui"
      data-wasm-opt="2"
    >
    <style>
      :root {
        color-scheme: dark;
        background: #0b1220;
        font-family: Inter, system-ui, sans-serif;
      }

      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      #startup_status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        color: #dce7f7;
        background: radial-gradient(circle at center, #16243b, #0b1220 65%);
        letter-spacing: 0.02em;
      }

      #startup_status::before {
        width: 2rem;
        height: 2rem;
        margin: auto;
        content: "";
        border: 2px solid #2b3a52;
        border-top-color: #56d6c9;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <canvas id="yield_canvas"></canvas>
    <div id="startup_status">
      <noscript>JavaScript and WebAssembly are required.</noscript>
      <span>Preparing wafer workspace</span>
    </div>
  </body>
</html>
