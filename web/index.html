<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6f5">
    <meta
      name="description"
      content="An interactive wafer die-yield and probe-planning workspace."
    >
    <title>Die Yield Calculator</title>
    <base data-trunk-public-url>
    <link data-trunk rel="copy-file" href="favicon.svg">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link
      data-trunk
      rel="rust"
      href="../crates/die-yield-gui/Cargo.toml"
      data-bin="die-yield-gui"
      data-wasm-opt="2"
    >
    <style>
      :root {
        color-scheme: light;
        background: #f3f6f5;
        font-family: Inter, system-ui, sans-serif;
      }

      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #startup_status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        color: #627272;
        background: #f3f6f5;
        letter-spacing: 0.02em;
      }

      #startup_status::before {
        width: 2rem;
        height: 2rem;
        margin: auto;
        content: "";
        border: 2px solid #d8e0de;
        border-top-color: #007c74;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <p id="canvas_instructions" class="visually-hidden">
      Interactive calculator canvas. Use Tab and Shift+Tab to move through controls,
      Enter or Space to activate controls, and activate a numeric value to type it.
      Press Control Alt S to toggle browser speech generated by the application.
    </p>
    <canvas
      id="yield_canvas"
      tabindex="0"
      role="application"
      aria-label="Die yield calculator workspace"
      aria-describedby="canvas_instructions"
    ></canvas>
    <div id="startup_status">
      <noscript>JavaScript and WebAssembly are required.</noscript>
      <span>Preparing wafer workspace</span>
    </div>
  </body>
</html>
